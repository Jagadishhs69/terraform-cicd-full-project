name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or qa)'
        required: true
        type: choice
        options:
          - dev
          - qa

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.REPO_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: |
          terraform -chdir=infra/${{ github.event.inputs.environment }} init -reconfigure -upgrade \
            -backend-config="bucket=terraform-state-cicd-33993333" \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=${{ github.event.inputs.environment }}-terraform-lock"

      - name: Terraform Plan
        run: terraform -chdir=infra/${{ github.event.inputs.environment }} plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: infra/${{ github.event.inputs.environment }}/tfplan

  apply:
      runs-on: ubuntu-latest
      needs: plan
      environment: ${{ github.event.inputs.environment }}
      steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.event.inputs.environment }}
          path: infra/${{ github.event.inputs.environment }}

      - name: Terraform Init
        run: |
          terraform -chdir=infra/${{ github.event.inputs.environment }} init -reconfigure -upgrade \
            -backend-config="bucket=terraform-state-cicd-33993333" \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=${{ github.event.inputs.environment }}-terraform-lock"

      - name: Terraform Apply
        run: terraform -chdir=infra/${{ github.event.inputs.environment }} apply tfplan